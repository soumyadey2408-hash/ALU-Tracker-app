name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
defaults:
  run:
    working-directory: alu_tracker_flutter
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android scaffold
        run: flutter create . --platforms=android --org com.alu --project-name alu_tracker
      - name: Apply ALU manifest and activity
        run: |
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          MA=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          DIR=$(dirname "$MA"); rm -f "$MA"
          cp android_overrides/MainActivity.kt "$DIR/MainActivity.kt"
      - name: Raise minSdk for Firebase
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: alu-tracker-apk
          path: alu_tracker_flutter/build/app/outputs/flutter-apk/app-release.apk
